# Render.com deployment configuration
# Deploy: connect this repo to Render and it auto-detects this file
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cyberark-rag-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: CYBERARK_RAG_SEARCH_MODE
        value: bm25
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MCP_ALLOWED_HOST
        value: "cyberark-rag-mcp.onrender.com"
